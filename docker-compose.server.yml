# Production server — boshqa loyihalarga ta'sir qilmasin
# API: 127.0.0.1:8020 (nginx orqali posapi.devflix.uz)
# Postgres: faqat ichki docker tarmog'i

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pos
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD talab qilinadi}
    volumes:
      - pos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos -d pos"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgres://pos:${POSTGRES_PASSWORD}@db:5432/pos
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: posapi.devflix.uz,localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: https://pos.devflix.uz
      CSRF_TRUSTED_ORIGINS: https://pos.devflix.uz,https://posapi.devflix.uz
      SEED_DATABASE: "false"
    ports:
      - "127.0.0.1:8020:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  pos_postgres_data:
